<text x="600.0" y="460.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="36.0" letter-spacing="16.0" fill="#ff4d00" fill-opacity="0.85">SVJETLEĆA REKLAMA</text>
<rect x="144.0" y="560.0" width="912.0" height="2" fill="#ff4d00" opacity="0.5"/><text x="1176" y="778" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="13" letter-spacing="4" fill="#ffffff" fill-opacity="0.35">[HERO VIZUAL]</text>
<rect x="0.5" y="0.5" width="1199" height="799" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
