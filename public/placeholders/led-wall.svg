<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#1a1a1d"/><stop offset="1" stop-color="#0a0a0b"/>
</linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#ffffff" opacity="0.16"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#wall)"/>
<rect width="1600" height="900" fill="url(#dots)"/>
<ellipse cx="800.0" cy="414.0" rx="672.0" ry="306.0" fill="#ff4d00" opacity="0.13" filter="url(#soft)"/>
<g filter="url(#glow)"><text x="800.0" y="468.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="bold" font-size="180.0" letter-spacing="10.8" fill="#fff7f0">APS MEDIA</text></g>
<text x="800.0" y="517.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="40.5" letter-spacing="18.0" fill="#ff4d00" fill-opacity="0.85">LED / 3D SIGNAGE</text>
<rect x="192.0" y="630.0" width="1216.0" height="2" fill="#ff4d00" opacity="0.5"/><text x="1576" y="878" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="13" letter-spacing="4" fill="#ffffff" fill-opacity="0.35">[LED ZID]</text>
<rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
</svg>